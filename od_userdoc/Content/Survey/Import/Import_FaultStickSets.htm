        <h3 style="text-align: justify; page-break-before: avoid">4.3.5 Import FaultStickSets<MadCap:keyword term="Import FaultStickSets" /></h3>
        <p>Fault stick sets are a directly-editable version of fault planes.  They can be imported in OpendTect via <i>Survey &gt; Import &gt; FaultStickSets</i>, from Ascii files for 2D and 3D, both having options for single or bulk import.</p>
